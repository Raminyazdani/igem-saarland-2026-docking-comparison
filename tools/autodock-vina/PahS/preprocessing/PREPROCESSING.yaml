# PREPROCESSING manifest for AutoDock Vina  (branch tool/autodock-vina)
#
# Fill EVERY key. Keep the keys and structure identical to the other tools - this file is read
# side-by-side across all tools by scripts/compare_preprocessing/ so we can compare recipes and, if
# possible, converge on ONE shared preprocessing that works for every tool.
#
# Use null only where a step genuinely does not apply to your tool (and say why in notes).
# Record exact tools + versions so the recipe is reproducible.

tool: AutoDock Vina
branch: tool/autodock-vina
owners: [Ana, Divyashree]
input_version_used: v0-draft        # set to "input-v1" once the canonical structure+box are frozen

# ---------- RECEPTOR preprocessing (what you did to the shared structure.pdb) ----------
receptor:
  source: input/canonical/targets/PahS/structure.pdb   # the shared receptor (PahP primary)
  signal_peptide_removed: false      # true|false ; if true, which residues (e.g. "1-24")
  residue_range_used: full          # e.g. "25-317" (mature domain) or "full"
  protonation_pH: 7.4               # match canonical unless you justify otherwise
  hydrogens_added: true, PDBFixer             # true|false + method
  charges_method: Gasteiger              # e.g. Gasteiger | AM1-BCC | Kollman | none
  waters_removed: false              # true|false
  cofactors_or_ions_kept: none      # list or none
  flexible_residues: none           # list or none (rigid)
  output_format: PDBQT               # e.g. PDBQT | mol2 | Maestro(.maegz) | PDB
  prep_software: Meeko 0.7.1               # e.g. Meeko 0.5 | ADFR | Maestro 2024 | MOE
  output_file: inputs/receptor.pdbqt

# ---------- LIGAND preprocessing (what you did to the shared ligands.sdf) ----------
ligand:
  source: input/canonical/ligands/ligands.sdf          # shared 3D conformers (with Hs)
  used_canonical_3d: true           # true = docked the shared conformers as-is (preferred for fairness)
  regenerated_conformers: false      # true|false + method if you re-embedded
  protonation_pH: 7.4
  tautomers_enumerated: false        # true|false + tool
  charges_method: Gasteiger              # e.g. Gasteiger | AM1-BCC | none
  output_format: PDBQT               # e.g. PDBQT | mol2 | SDF
  prep_software: Meeko 0.7.1
  output_file: inputs/ligands.pdbqt

# ---------- BINDING SITE / BOX ----------
binding_site:
  source: input/canonical/targets/PahP/binding_site.yaml
  mode: blind                        # defined | blind
  center_xyz: [73.8275, 71.3505, 76.722]                  # [x, y, z] in angstrom, or null if blind
  size_xyz: [65, 70, 93]                    # [x, y, z] in angstrom, or null if blind
  pocket_detection: null            # e.g. server-auto | fpocket | P2Rank | manual

# ---------- provenance ----------
software_versions: {receptor_prep: "Meeko 0.7.1", ligand_prep: "Meeko 0.7.1", pocket_detection: "none", docking: "AutoDock Vina 1.2.7"}               # {receptor_prep: "...", ligand_prep: "...", docking: "..."}
random_seed: 42
assumptions_and_deviations: []      # anything you changed vs canonical, and WHY (list of strings)
notes: ""
