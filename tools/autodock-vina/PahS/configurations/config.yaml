# AutoDock Vina docking parameters (tool/autodock-vina).
# These feed run_docking.sh and get copied into DOCKING_RESULT.json -> docking_parameters.
tool: AutoDock Vina
branch: tool/autodock-vina

# How AutoDock Vina's native score should be read for ranking.
# Vina/Glide: lower_is_better ; GOLD: higher_is_better ; CONFIRM for your tool.
score_direction: lower_is_better   # CONFIRM
score_unit: kcal/mol                        # e.g. kcal/mol | ChemPLP | GlideScore | confidence

# Search box. PahS was docked blind (whole receptor) per docking_config.yaml;
# canonical targets/PahS/binding_site.yaml was a placeholder at the time.
box:
  mode: blind              # defined | blind
  center_xyz: [73.8275, 71.3505, 76.722]   # [x, y, z] angstrom
  size_xyz: [65, 70, 93]                   # [x, y, z] angstrom, encloses the whole receptor

# Sampling / scoring settings (tool-specific).
exhaustiveness: 32    # e.g. 16 (Vina); null if N/A
num_poses: 9         # poses to keep per ligand
scoring_function: vina  # e.g. vina | ChemPLP | SP/XP | CDOCKER
random_seed: 42         # fix where the tool allows, for reproducibility
extra: {}               # any other tool-specific flags
