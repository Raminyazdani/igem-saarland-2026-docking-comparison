tool: AutoDock Vina
branch: tool/autodock-vina
owners: [Ana, Divyashree]
input_version_used: v0-draft

receptor:
  source: input/canonical/targets/PahP/structure.pdb
  signal_peptide_removed: false
  residue_range_used: full
  protonation_pH: 7.4
  hydrogens_added: true              # already present in canonical structure (OpenMM/PDBFixer)
  charges_method: Gasteiger
  waters_removed: false              # none present in canonical structure
  cofactors_or_ions_kept: none
  flexible_residues: none
  output_format: PDBQT
  prep_software: Open Babel
  output_file: inputs/receptor.pdbqt

ligand:
  source: input/canonical/ligands/ligands.sdf
  used_canonical_3d: true
  regenerated_conformers: false
  protonation_pH: 7.4
  tautomers_enumerated: false
  charges_method: Gasteiger
  output_format: PDBQT
  prep_software: Open Babel
  output_file: inputs/pyrene.pdbqt

binding_site:
  source: input/canonical/targets/PahP/binding_site.yaml
  mode: defined
  center_xyz: [70.83, 71.96, 59.18]
  size_xyz: [21.3, 19.6, 27.3]
  pocket_detection: fpocket 4.2.2, ranked by custom hydrophobicity/apolar-SASA/aromatic-residue composite score, cross-validated via blind Vina docking

software_versions: {receptor_prep: "Open Babel 3.1.0", ligand_prep: "Open Babel 3.1.0", pocket_detection: "fpocket 4.2.2", docking: "AutoDock Vina 1.2.7"}
random_seed: 42
assumptions_and_deviations:
  - "Canonical binding_site.yaml was still a placeholder (all-null) at time of this work. Defined the box from fpocket Pocket 4, chosen using a hydrophobicity/apolar-SASA/aromatic-residue composite score (not fpocket's default druggability metric, which is calibrated for oral-drug-likeness and not relevant to this PAH biosensor context). Independently cross-validated via blind Vina docking: top 10 best-affinity poses (-7.98 to -6.65 kcal/mol) landed within 1.3-2.4A of the Pocket 4 center. Proposing this as the shared binding_site.yaml value for team review."
notes: "PahP + pyrene only in this commit. PahS/naphthalene owned by Ana, not included here."
