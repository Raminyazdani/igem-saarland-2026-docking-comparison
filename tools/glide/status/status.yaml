notes: "Full workflow executed end to end on Schrodinger Suite 2026-1 (Glide v11.0): prepwizard ->
  LigPrep -> receptor grid -> Glide SP -> extraction -> validated DOCKING_RESULT.json (validator exits
  0, 7 rows, no warnings). Scores are copied verbatim from Glide's native CSV and were not tuned.
  Determinism was tested, not assumed: docking was run twice from the identical grid and returned
  identical scores for all 7 ligands, which matters because Glide exposes no random seed.
  Reproduction instructions in REPRODUCE.md; one-page summary in REPORT.pdf; workflow.svg shows the
  whole pipeline. An earlier run used a wrong box centre (the centroid of the published pocket
  residues, which falls inside protein density); that mistake and its diagnostics are recorded in
  preprocessing/steps.md so it is not repeated."
