# CB-Dock3 docking parameters (tool/cb-dock).
# These feed run_docking.sh and get copied into DOCKING_RESULT.json -> docking_parameters.
tool: CB-Dock3
branch: tool/cb-dock

# How CB-Dock3's native score should be read for ranking.
# Vina/Glide: lower_is_better ; GOLD: higher_is_better ; CONFIRM for your tool.
score_direction: lower_is_better   # confirmed for AutoDock Vina scores
score_unit: kcal/mol                    # e.g. kcal/mol | ChemPLP | GlideScore | confidence

# Search box (fill from input/canonical/targets/PahP/binding_site.yaml once it is real).
box:
  mode: blind           # defined | blind
  center_xyz: null      # [x, y, z] angstrom
  size_xyz: null        # [x, y, z] angstrom

# Sampling / scoring settings (tool-specific).
exhaustiveness: null    # e.g. 16 (Vina); null if N/A
num_poses: 1            # poses to keep per ligand
scoring_function: AutoDock Vina 1.2.0   # e.g. vina | ChemPLP | SP/XP | CDOCKER
random_seed: null       # CB-Dock3 did not expose a seed for these web runs
extra:
  mode: structure-based blind docking
  pocket_detection: CurPocket
  number_of_cavities: 5
  selection_rule: lowest docking score across the five structure-based cavities
  template_results_used: false

# Metadata used by the helper scripts and the standardized result file.
tool_slug: cb-dock
software_version: "CB-Dock3 web server; structure-based engine: AutoDock Vina 1.2.0"
targets: [PahP, PahS]
input_version_used: v0-draft
input_commit_hash: "6564a76"
hardware: "CB-Dock3 remote web server (hardware not reported)"
runtime_total_sec: null
date_completed: "2026-08-20"
